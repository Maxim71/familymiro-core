<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд Отца — Живая Матрица Пульсар</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #060913; 
            color: #00bfff; 
            font-family: 'Courier New', monospace; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .father-panel { 
            border: 2px solid #00bfff; 
            padding: 35px; 
            background: #0b1120; 
            box-shadow: 0 0 35px rgba(0, 191, 255, 0.25), inset 0 0 15px rgba(0, 191, 255, 0.1); 
            border-radius: 12px; 
            max-width: 600px; 
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .father-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #00bfff, #ff0055, #00bfff);
            animation: flow 3s linear infinite;
        }
        @keyframes flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        h2 { 
            font-size: 22px; 
            letter-spacing: 2px; 
            text-shadow: 0 0 12px #00bfff;
            margin-bottom: 25px;
            color: #ffffff;
        }
        .sonar-container {
            margin: 20px auto;
            width: 80px;
            height: 80px;
            position: relative;
        }
        .sonar-ring {
            border: 3px solid #ff0055;
            border-radius: 50%;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            animation: sonar 2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
            opacity: 0;
        }
        .sonar-ring:nth-child(2) { animation-delay: 0.6s; }
        .sonar-ring:nth-child(3) { animation-delay: 1.2s; }
        @keyframes sonar {
            0% { transform: scale(0.1); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; border-color: #00ffcc; }
        }
        .status-badge { 
            display: inline-block;
            background: rgba(255, 0, 85, 0.15);
            color: #ff0055; 
            padding: 6px 14px;
            font-size: 14px; 
            font-weight: bold; 
            border: 1px solid #ff0055;
            border-radius: 4px;
            text-shadow: 0 0 5px #ff0055;
            margin-bottom: 20px;
        }
        .data-field {
            background: #070b14;
            border: 1px solid #1e293b;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            margin-bottom: 15px;
        }
        .data-label { color: #475569; font-size: 12px; text-transform: uppercase; margin-bottom: 4px; }
        .data-value { color: #00ffcc; font-size: 16px; text-shadow: 0 0 8px rgba(0, 255, 204, 0.4); }
        .coffee-capital {
            margin-top: 25px;
            font-size: 18px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-weight: bold;
            border-top: 1px dashed #1e293b;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="father-panel">
        <h2>📡 МАТРИЦА «ПУЛЬСАР НАЦИЙ»</h2>
        
        <div class="sonar-container">
            <div class="sonar-ring"></div>
            <div class="sonar-ring"></div>
            <div class="sonar-ring"></div>
        </div>

        <div class="status-badge">ИМПУЛЬС МИРА АКТИВЕН</div>

        <div class="data-field">
            <div class="data-label">Регион входящего триггера / Geo Source</div>
            <div class="data-value">📍 {{ pulsar.country }}</div>
        </div>

        <div class="data-field">
            <div class="data-label">Метка фиксации в Postgres / Timestamp</div>
            <div class="data-value">⏱️ {{ pulsar.timestamp }}</div>
        </div>

        <div class="coffee-capital">
            ☕ Капитал Ёжика на кофе: {{ ezhik.total_revenue }} СБП
        </div>
    </div>

</body>
</html>
