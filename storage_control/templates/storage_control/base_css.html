{% load static %}
<!-- ⚓️ СУВЕРЕННЫЕ META-ЯКОРЯ ДЛЯ ГЛОБАЛЬНОГО SEO И ИЩЕЙКИ ТРАФИКА -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<meta name="description" content="FAMILYMIRO 1.6 — Суверенная b2b-платформа автоматизации снабжения ИТР и медиа-выгрузок.">
<meta name="theme-color" content="#0a0f1d">

<link rel="stylesheet" href="{% static 'core/css/mezzanine.css' %}">
<style>
    /* 🌐 ТОПОВЫЙ МИРОВОЙ ДИЗАЙН: СОЧЕТАНИЕ ЧИСТОТЫ GOOGLE И КИБЕР-АКЦЕНТОВ STRIPE */
    body { 
        background: #090d16 radial-gradient(ellipse at top, #0f172a 0%, #070a12 100%) no-repeat center center fixed;
        background-size: cover;
        color: #f1f5f9; 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; 
        margin: 0; 
        padding: 0; 
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }
    
    /* Тонкая премиальная сетка Google-Cloud на заднем плане (Живой параллакс) */
    body::before {
        content: ""; position: fixed; top: -5%; left: -5%; width: 110%; height: 110%;
        background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: -2; pointer-events: none;
    }

    /* 💎 ПРЕМИУМ КАРТОЧКИ (ИНТЕРФЕЙС ТОПОВЫХ ПЛАТФОРМ) */
    .b2b-card {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .b2b-card:hover {
        transform: translateY(-2px);
        border-color: rgba(0, 198, 255, 0.4);
        box-shadow: 0 8px 30px rgba(0, 198, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* 📊 ВЫСОКОТЕХНОЛОГИЧНЫЕ СТРОГИЕ ТАБЛИЦЫ СНАБЖЕНИЯ И ТАРИФОВ */
    table { 
        width: 100%; 
        border-collapse: separate; 
        border-spacing: 0;
        margin-top: 20px; 
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    th { 
        background: #0f172a; 
        color: #94a3b8; 
        font-weight: 600; 
        text-transform: uppercase; 
        font-size: 0.75rem; 
        letter-spacing: 1px;
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    td { 
        background: rgba(15, 23, 42, 0.4);
        padding: 14px 20px; 
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.9rem;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(30, 41, 59, 0.5); color: #fff; }

    /* 💰 КНОПКИ ПРИНЯТИЯ СРЕДСТВ И СТАРТА УРОВНЯ GOOGLE ADWORDS */
    button, .b2b-btn, .b2b-btn-start { 
        background: #0072ff;
        background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); 
        color: #fff; 
        border: none; 
        padding: 12px 28px; 
        border-radius: 6px; 
        cursor: pointer; 
        font-weight: 600; 
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        transition: all 0.15s ease;
        box-shadow: 0 4px 12px rgba(0, 114, 255, 0.2);
    }
    button:hover, .b2b-btn:hover, .b2b-btn-start:hover { 
        box-shadow: 0 6px 16px rgba(0, 114, 255, 0.4);
        transform: translateY(-1px);
        opacity: 0.95;
    }
    
    /* Поля ввода Google Material Design */
    input[type="text"], input[type="number"] {
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        padding: 10px 16px;
        border-radius: 6px;
        outline: none;
        font-size: 0.9rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus, input[type="number"]:focus {
        border-color: #00c6ff;
        box-shadow: 0 0 0 3px rgba(0, 198, 255, 0.15);
    }
</style>

<!-- 🧬 МИКРО-СКРИПТ ПАРАЛЛАКСА СЕТКИ ДЛЯ ИДЕАЛЬНОЙ ПЛАВНОСТИ БРАУЗЕРОВ -->
<script>
    document.addEventListener('mousemove', function(e) {
        const x = (e.clientX / window.innerWidth - 0.5) * 12;
        const y = (e.clientY / window.innerHeight - 0.5) * 12;
        document.body.style.backgroundPosition = `calc(50% + ${x}px) calc(0% + ${y}px)`;
    });
</script>
