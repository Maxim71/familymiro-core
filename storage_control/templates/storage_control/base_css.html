<!-- FAMILYMIRO GLOBAL HUD STYLES V1.6 — МАТРИЧНОЕ ЯДРО ДИЗАЙНА -->
<style>
    :root {
        --bg-main: #05070f;
        --bg-card: rgba(13, 20, 38, 0.65);
        --border-color: rgba(255, 255, 255, 0.08);
        --neon-cyan: #00f2fe;
        --neon-green: #10b981;
        --neon-gold: #f9d423;
        --text-white: #f1f1f1;
        --text-muted: #94a3b8;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-main);
        color: var(--text-white);
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    /* Премиальные b2b-карточки слотов */
    .b2b-card {
        background: var(--bg-card);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        transition: all 0.25s ease;
    }

    .b2b-card:hover {
        transform: translateY(-2px);
        border-color: var(--neon-cyan);
        box-shadow: 0 10px 25px rgba(0, 242, 254, 0.12);
    }

    /* Суверенные кнопки управления кассами и навигацией */
    button, .b2b-btn {
        background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%);
        color: var(--text-white);
        border: none;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-block;
        text-align: center;
    }

    button:hover, .b2b-btn:hover {
        filter: brightness(1.15);
        transform: translateY(-1px);
        box-shadow: 0 5px 15px rgba(29, 78, 216, 0.35);
    }

    /* Адаптивные поля ввода (Пароли, Поиск, IP-шлюзы) */
    input[type="text"], input[type="password"], textarea {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border-color);
        color: var(--text-white);
        padding: 12px;
        border-radius: 6px;
        font-size: 0.9rem;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    input[type="text"]:focus, input[type="password"]:focus {
        outline: none;
        border-color: var(--neon-cyan);
        box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
    }

    /* Левое боковое Ютуб-меню */
    .menu-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 11px 16px;
        border-radius: 8px;
        color: var(--text-white);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 4px;
        transition: background 0.15s ease;
    }

    .menu-item:hover, .menu-item.active {
        background: rgba(255, 255, 255, 0.08);
    }
</style>
