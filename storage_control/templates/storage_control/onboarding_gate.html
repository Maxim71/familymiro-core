<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FamilyMira — Кибер-Гейт Онбординга ИТР</title>
    <style>
        body { background: #030712; color: #f3f4f6; font-family: 'Courier New', monospace; padding: 30px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .gate-card { width: 650px; background: #0b1329; border: 2px solid #8b5cf6; border-radius: 16px; padding: 30px; box-shadow: 0 0 40px rgba(139, 92, 246, 0.3); position: relative; }
        .gate-header { text-align: center; border-bottom: 2px solid #8b5cf6; padding-bottom: 15px; margin-bottom: 25px; }
        .gate-title { color: #fff; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px #8b5cf6; text-transform: uppercase; }
        .port-badge { background: #1e1b4b; border: 1px solid #6366f1; color: #818cf8; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        .form-control { width: 100%; padding: 12px; background: #020617; border: 1px solid #334155; border-radius: 8px; color: #fff; font-family: monospace; font-size: 13px; box-sizing: border-box; }
        .form-control:focus { border-color: #8b5cf6; outline: none; box-shadow: 0 0 10px rgba(139, 92, 246, 0.2); }
        .btn-gate { width: 100%; padding: 14px; background: #8b5cf6; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; text-transform: uppercase; transition: 0.2s; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
        .btn-gate:hover { background: #a78bfa; transform: translateY(-1px); }
        .ezhik-response { margin-top: 25px; background: #020617; border-left: 4px solid #10b981; padding: 15px; border-radius: 0 8px 8px 0; display: none; font-size: 12px; line-height: 1.6; }
        .network-matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; font-size: 10px; text-align: center; }
        .matrix-node { background: #111c40; padding: 8px; border-radius: 6px; border: 1px solid #1e293b; }
    </style>
</head>
<body>
    <div class="gate-card">
        <div class="gate-header">
            <div class="gate-title">🦔 РОБОТ-ЁЖИК // ЖИВОЙ ИИ-ВХОД ИТР v94.0</div>
            <div style="margin-top: 8px; font-size: 11px; color: #10b981;">● СЛУЖБА КОНТЕНТ-ВЕРИФИКАЦИИ СИНДИКАТА РАБОТАЕТ В ОЗУ</div>
        </div>

        <form id="onboarding_form">
            <div class="form-group">
                <label>1. Введите Имя, Ник или Ваш Telegram ID:</label>
                <input type="text" id="guest_id" class="form-control" value="Telegram_ID_777_Maxim" required>
            </div>

            <div class="form-group">
                <label>2. Выберите Вашу Кастовую Должность (ИТР-Статус):</label>
                <select id="chosen_role" class="form-control" style="background: #020617;">
                    <option value="CHIEF_ENG">Главный инженер проекта (Нач. объекта)</option>
                    <option value="PTO_ENG" selected>Инженер ПТО (Ведение ИД, Слой DXF)</option>
                    <option value="FOREMAN">Производитель работ (Прораб Склада М19)</option>
                    <option value="BIM_COORD">Специалист информационного моделирования (BIM/IFC)</option>
                    <option value="BUYER_B2B">Покупатель / Заказчик B2B снабжения</option>
                </select>
            </div>

            <div class="form-group">
                <label>3. Введите 6-значный Ключ Безопасности TOTP (Google Authenticator):</label>
                <input type="text" id="totp_key" class="form-control" placeholder="******" maxlength="6" value="123456">
            </div>

            <button type="button" class="btn-gate" onclick="fireEzhikOnboarding()">🪐 АКТИВИРОВАТЬ ИТР-СКИЛЛ И ВОЙТИ В КОНТУР ()</button>
        </form>

        <!-- Вывод аналитического ответа Тритона и Жука -->
        <div class="ezhik-response" id="response_box"></div>

        <!-- Сетка плавающих ИТР-портов, которую ты разметил -->
        <div class="network-matrix">
            <div class="matrix-node">
                <span style="color:#a78bfa;">🔒 ВЕЧНОСТЬ</span><br>
                <span class="port-badge">PORT: 8503</span>
            </div>
            <div class="matrix-node">
                <span style="color:#10b981;">📐 СТРОЙКА</span><br>
                <span class="port-badge">PORT: 8501</span>
            </div>
            <div class="matrix-node">
                <span style="color:#f59e0b;">🎬 РЕЖИССЕР</span><br>
                <span class="port-badge">PORT: 8502</span>
            </div>
        </div>
    </div>

    <script>
        async function fireEzhikOnboarding() {
            let gId = document.getElementById('guest_id').value;
            let role = document.getElementById('chosen_role').value;
            let totp = document.getElementById('totp_key').value;
            let rBox = document.getElementById('response_box');
            
            rBox.style.display = "block";
            rBox.style.borderLeftColor = "#f59e0b";
            rBox.innerHTML = "⚡ [ПРОЦЕССИНГ]: Подвижной Жук летит по вагонам... Тритон ИИ пакует Bottle JSON...";

            try {
                let response = await fetch('/api/v1/portal/onboarding', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        guest_name_or_id: gId,
                        chosen_skill: role,
                        invitation_source: "telegram_bot",
                        nested_machine_metadata: { totp_token: totp, request_port: 8501 }
                    })
                });
                let data = await response.json();
                
                rBox.style.borderLeftColor = "#10b981";
                rBox.innerHTML = `
                    <strong style="color:#10b981;">[АВТЕНТИФИКАЦИЯ УСПЕШНА // 200 OK]:</strong><br>
                    • ${data.welcome_message}<br>
                    • <strong>Аватар Вечности:</strong> ${data.avatar.avatar_type} (${data.avatar.visual_style})<br>
                    • <strong>Шлюз Тритона:</strong> Расчет моточасов и осей упакован в Bottle на порт <span class="port-badge">8503</span><br>
                    • <strong>IaC Колеса Жука:</strong> Сцепка с Номад-контуром на порту <span class="port-badge">8502</span> выполнена!<br><br>
                    <a href="${data.redirect_endpoint}" style="color:#00ffcc; font-weight:bold; text-decoration:none;">➡️ ВОЙТИ В СУВЕРЕННЫЙ КАБИНЕТ ВАГОНА ПТО ➔</a>
                `;
            } catch (err) {
                rBox.style.borderLeftColor = "#dc2626";
                rBox.innerHTML = "🔴 [СБОЙ]: Превышено время ожидания ответа от Тритон-Оркестратора.";
            }
        }
    </script>
</body>
</html>
