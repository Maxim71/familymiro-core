server {
    listen 80;
    listen 443 ssl;
    server_name 89.111.155.234 185.182.110.96 miroha.ru;

    # Гостевой контур и главная страница (Плавающий IP)
    location / {
        proxy_pass http://127.0.0.1:8000; # Уходит на Django/Flask монолит
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Изолированный вагон РЕЖИССЕРА (Асинхронный FastAPI/Triton шлюз)
    location /api/v1/ {
        proxy_pass http://0.0.0;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
