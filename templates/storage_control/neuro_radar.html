<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ-Нейрорадар Технадзора</title>
    <style>
        body { 
            background: #090c15; 
            color: #38bdf8; 
            font-family: monospace; 
            padding: 40px; 
            text-align: center;
        }
        .radar-box { 
            border: 2px solid #38bdf8; 
            padding: 30px; 
            display: inline-block; 
            background: #111827; 
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); 
            border-radius: 12px; 
            max-width: 600px;
            width: 100%;
        }
        .scanner {
            width: 120px;
            height: 120px;
            border: 2px dashed #00ffcc;
            border-radius: 50%;
            margin: 20px auto;
            position: relative;
            animation: rotate_radar 4s linear infinite;
        }
        .scanner::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%; width: 50%; height: 2px;
            background: #00ffcc;
            transform-origin: left center;
        }
        @keyframes rotate_radar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .pulse { color: #ff0055; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="radar-box">
        <h2>🏗️ НЕЙРО-РАДАР СТРОИТЕЛЬНОГО КОНТРОЛЯ</h2>
        <div class="scanner"></div>
        <p class="pulse">● СКАНИРОВАНИЕ ОБЪЕКТА НА 300 МЕТРОВ... СТАТУС: ОК</p>
        <hr style="border-color: #38bdf8; margin: 20px 0;">
        <p>Все СНиПы и ГОСТы верифицированы автоматически.</p>
        <p style="color: #ffd700;">☕ Капитал Ёжика на кофе: {{ ezhik.total_revenue }} СБП</p>
    </div>
</body>
</html>
