<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Глобальный Шлюз Трансформера</title>
    <style>
        body { background: #0a0b0d; color: #ff0055; font-family: monospace; padding: 40px; text-shadow: 0 0 8px #ff0055; }
        .container { border: 2px solid #ff0055; padding: 20px; background: #0f1115; max-width: 600px; margin: 0 auto; box-shadow: 0 0 15px #ff0055; }
        .neon-green { color: #00ffcc; text-shadow: 0 0 8px #00ffcc; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌐 ГЛОБАЛЬНЫЙ ШЛЮЗ ТОКИО-РУНЕТ</h2>
        <p><b>Текущий режим:</b> <span class="neon-green">{{ global_ui.mode }}</span></p>
        <p><b>Неоновая тема:</b> <span class="neon-green">{{ global_ui.neon_theme }}</span></p>
        <hr style="border-color: #00ffcc;">
        <ul>
            <li>{{ global_ui.core_functions.capsule }}</li>
            <li>{{ global_ui.core_functions.construction }}</li>
            <li>{{ global_ui.core_functions.media }}</li>
        </ul>
        <p class="neon-green">Баланс системы: {{ ezhik.total_revenue }}</p>
    </div>
</body>
</html>
