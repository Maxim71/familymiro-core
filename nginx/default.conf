server {
    listen 80;
    server_name 185.182.110.96;

    # 👑 ГЛАВНЫЙ ВХОД: Премиальный Apple Black Монолит и ИИ-Радар смет
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded-for;
    }

    # 🏬 ГОСТЕВОЙ КОНТУР ИНВЕСТОРОВ И МАРКЕТИНГ (Flask)
    location /investor/ {
        proxy_pass http://miro_marketing_flask:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 🚂 КАНАЛ СВЯЗИ ТРИТОНА И АСИНХРОННОГО ЭФИРА (Tornado / Торнадо)
    location /chat/ {
        proxy_pass http://miro_tornado_core:8888/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
