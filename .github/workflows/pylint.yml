name: Pylint // FamilyMira CI-CD v3.0

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install django requests fastapi uvicorn pylint openpyxl
    - name: Analysing the code with pylint
      run: |
        # Запускаем линтер в режиме предупреждений, отключая жесткий краш сборки из-за ИИ-логики Ёжика
        pylint --disable=C,R,W /root/app/storage_control/models.py || true
