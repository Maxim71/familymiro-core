version: '3.8'

services:
  # Вагон 1: ВЕЧНОСТЬ (База данных PostgreSQL)
  miro_postgres_evolution:
    image: postgres:15-alpine
    container_name: miro_postgres_evolution
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Вагон 2: СИГНАЛИЗАЦИЯ ОЧЕРЕДЕЙ (Redis брокер)
  miro_redis_broker:
    image: redis:7-alpine
    container_name: miro_redis_broker
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  # Вагон 3: СТРОЙКА (Главный Django-Монолит)
  miro_web_monolith:
    image: python:3.10-slim
    container_name: miro_web_monolith
    restart: always
    working_dir: /root/app
    volumes:
      - /root/app:/root/app
    ports:
      - "0.0.0.0:8000:8000"
    command: sh -c "pip install -r requirements.txt && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - miro_postgres_evolution
      - miro_redis_broker

  # Вагон 4: МЕЗОНИН СНАБЖЕНИЯ (Flask контур)
  miro_marketing_flask:
    image: python:3.10-slim
    container_name: miro_marketing_flask
    restart: always
    ports:
      - "127.0.0.1:5000:5000"

  # Вагон 5: АСИНХРОННЫЙ ВЕБ-ЭФИР (Tornado Core)
  miro_tornado_core:
    image: python:3.10-slim
    container_name: miro_tornado_core
    restart: always
    ports:
      - "127.0.0.1:8888:8888"

volumes:
  postgres_data:
