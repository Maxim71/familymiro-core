version: '3.8'

networks:
  app_default:
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    container_name: miro_postgres_evolution
    restart: always
    environment:
      POSTGRES_DB: miroha_db
      POSTGRES_USER: maxim_admin
      POSTGRES_PASSWORD: MirohaCryptoPostgres2026
    ports:
      - "5432:5432"
    networks:
      - app_default

  redis:
    image: redis:7-alpine
    container_name: miro_redis_broker
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app_default

  web:
    image: app_miro_web_monolith:latest
    container_name: miro_web_monolith
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    networks:
      - app_default

  miro_marketing_flask:
    image: python:3.10-slim
    container_name: miro_marketing_flask
    restart: always
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    command: sh -c "pip install --no-cache-dir flask && python3 /app/app_flask.py"
    networks:
      - app_default

  miro_tornado_core:
    image: python:3.10-slim
    container_name: miro_tornado_core
    restart: always
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    command: sh -c "pip install --no-cache-dir tornado && python3 /app/app_tornado.py"
    networks:
      - app_default

  nginx:
    image: nginx:stable-alpine
    container_name: miro_nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - .:/app
    networks:
      - app_default
