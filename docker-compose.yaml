version: '3.8'

services:
  # 🚀 Новая промо-ракета Flask (Привлечение блогеров, промо-страницы и маркетинг)
  flask_marketing_service:
    image: python:3.10-slim
    container_name: miro_marketing_flask
    restart: always
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "5000:5000"  # Парадный порт Flask для промо-страниц привлечения
    networks:
      familymiro_default:
        aliases:
          - flask
          - promo_engine
    environment:
      - DATABASE_URL=postgresql://postgres:MirohaCryptoPostgres2026@db:5432/miroha_db
      - LAVA_API_TOKEN=LAVA_SECRET_API_TOKEN_2026_PERFECT
    deploy:
      resources:
        limits:
          memory: 100M  # Ультра-легкий Flask
    command: python flask_service/main.py

  # 🌪️ Асинхронное веб-ядро Tornado (Чат, Короткие видео и Стримы блогеров)
  tornado_gateway:
    image: python:3.10-slim
    container_name: miro_tornado_core
    restart: always
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8888:8888"  # Websocket-шлюз
    networks:
      familymiro_default:
        aliases:
          - tornado
          - chat_core
    environment:
      - DATABASE_URL=postgresql://postgres:MirohaCryptoPostgres2026@db:5432/miroha_db
    deploy:
      resources:
        limits:
          memory: 200M
    command: python gateway.py

networks:
  familymiro_default:
    name: familymiro_default
